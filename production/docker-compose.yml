# SatanicChain L1 production — public RPC via nginx
# cd production && cp .env.example .env && docker compose up -d

x-geth: &geth
  image: ethereum/client-go:v1.13.14
  restart: unless-stopped
  stop_grace_period: 60s

services:
  init:
    <<: *geth
    container_name: satanic-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for d in /data1 /datarpc; do
          if [ ! -d "$$d/geth" ]; then geth init --datadir=$$d /genesis.json; fi
        done
        echo init done
    volumes:
      - ../l1/genesis.json:/genesis.json:ro
      - geth_node1:/data1
      - geth_rpc:/datarpc
    restart: "no"

  node1:
    <<: *geth
    container_name: satanic-node1
    depends_on:
      init:
        condition: service_completed_successfully
    command:
      - --datadir=/data
      - --networkid=666
      - --syncmode=full
      - --http --http.addr=0.0.0.0 --http.port=8545
      - --http.api=eth,net,web3,txpool,clique
      - --http.corsdomain=*
      - --ws --ws.addr=0.0.0.0 --ws.port=8546
      - --port=30303
      - --mine
      - --miner.etherbase=${VALIDATOR_1}
      - --unlock=${VALIDATOR_1}
      - --password=/secrets/password.txt
      - --allow-insecure-unlock
      - --verbosity=3
    ports:
      - "30303:30303/tcp"
      - "30303:30303/udp"
    volumes:
      - geth_node1:/data
      - ../l1/genesis.json:/genesis.json:ro
      - ${SECRETS_DIR:-../l1/secrets}:/secrets:ro
    networks: [satanic]

  rpc:
    <<: *geth
    container_name: satanic-rpc
    depends_on: [node1]
    command:
      - --datadir=/data
      - --networkid=666
      - --syncmode=full
      - --http --http.addr=0.0.0.0 --http.port=8545
      - --http.api=eth,net,web3,txpool
      - --http.corsdomain=*
      - --http.vhosts=*
      - --ws --ws.addr=0.0.0.0 --ws.port=8546
      - --port=30304
      - --verbosity=2
    volumes:
      - geth_rpc:/data
      - ../l1/genesis.json:/genesis.json:ro
    expose: ["8545", "8546"]
    networks: [satanic]

  nginx:
    image: nginx:1.27-alpine
    container_name: satanic-nginx
    depends_on: [rpc]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [satanic]

volumes:
  geth_node1:
  geth_rpc:

networks:
  satanic:
    driver: bridge
