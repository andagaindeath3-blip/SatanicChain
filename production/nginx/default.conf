upstream geth_http { server rpc:8545; }
upstream geth_ws { server rpc:8546; }
limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=30r/s;

server {
    listen 80;
    server_name rpc.satanicchain.local _;

    location /health {
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        limit_req zone=rpc_limit burst=50 nodelay;
        proxy_pass http://geth_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type application/json;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location /ws {
        proxy_pass http://geth_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
