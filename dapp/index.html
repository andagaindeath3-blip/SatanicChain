<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08070b">
<title>SatanicChain — Create · Swap · Bridge</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>html,body{margin:0;min-height:100%;background:#08070b!important;color:#f2eef6!important}</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <img class="logo" src="logo.gif" alt="SatanicChain" onerror="this.src='logo.png';this.onerror=null">
    <nav class="nav">
      <button type="button" data-tab="swap" class="on">SWAP</button>
      <button type="button" data-tab="create">CREATE</button>
      <button type="button" data-tab="bridge">BRIDGE</button>
      <button type="button" data-tab="pool">POOL</button>
      <button type="button" data-tab="wallet">WALLET</button>
    </nav>
  </aside>
  <main class="main">
    <div class="top">
      <div class="brand"><h1>SATANICCHAIN</h1><p>Create · Swap · Bridge</p></div>
      <div class="spacer"></div>
      <select id="netSelect" style="width:auto;min-width:170px"></select>
      <span class="pill" id="chainChip"><span class="dot"></span>network</span>
      <span class="pill primary" id="accountChip">Connect wallet</span>
    </div>
    <div id="tab"><div class="card"><p class="hint">Loading…</p></div></div>
    <div class="toast" id="toast"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="config.js"></script>
<script src="prices.js"></script>
<script src="create-token.js"></script>
<script src="app.js"></script>
</body>
</html>
